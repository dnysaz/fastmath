<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020" />
      <stop offset="100%" stop-color="#121a33" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#6c8cff" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <g opacity="0.15">
    <circle cx="200" cy="150" r="120" stroke="#6c8cff" stroke-width="2" fill="none" />
    <circle cx="1000" cy="480" r="90" stroke="#22d3ee" stroke-width="2" fill="none" />
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#6c8cff" stroke-width="1" />
    <line x1="600" y1="0" x2="600" y2="630" stroke="#22d3ee" stroke-width="1" />
  </g>
  <g font-family="system-ui, sans-serif" font-weight="800" letter-spacing="-3" text-anchor="middle">
    <text x="600" y="260" font-size="92" fill="#fff" filter="url(#glow)">245 + 187 = ?</text>
    <text x="600" y="380" font-size="36" fill="#eef2ff" opacity="0.95">FastMath — Quick Calculation Practice</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="28" fill="#9aa6c9" opacity="0.9">
    <text x="600" y="430">+  −  ×  ÷   |   1 digit / 2 digits / 3 digits</text>
  </g>
</svg>
